<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Citadel</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/css/tokens.css">
<script src="/static/js/theme-init.js"></script>
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/dashboard.css">
<link rel="stylesheet" href="/static/css/music.css">
<link rel="stylesheet" href="/static/css/news.css">
</head>
<body>
<div class="sweep"></div>

<div class="shell">
  <nav class="rail" aria-label="Primary">
    <span class="rail__logo"><svg class="i"><use href="#i-logo"/></svg></span>
    <a href="#home" data-view="home" aria-current="page" title="Home"><svg class="i"><use href="#i-home"/></svg><span class="rail__label">Home</span></a>
    <a href="#news" data-view="news" title="News"><svg class="i"><use href="#i-news"/></svg><span class="rail__label">News</span></a>
    <a href="#media" data-view="media" title="Media"><svg class="i"><use href="#i-film"/></svg><span class="rail__label">Media</span></a>
    <a href="#music" data-view="music" title="Companion"><svg class="i"><use href="#i-disc"/></svg><span class="rail__label">Companion</span></a>
    <a href="#listen" data-view="listen" title="Music"><svg class="i"><use href="#i-wave"/></svg><span class="rail__label">Music</span></a>
    <a href="#ai" data-view="ai" title="Odysseus"><svg class="i"><use href="#i-spark"/></svg><span class="rail__label">Odysseus</span></a>
    <span class="spacer"></span>
    <a href="/settings" class="rail__settings" title="Settings"><svg class="i"><use href="#i-gear"/></svg><span class="rail__label">Settings</span></a>
  </nav>

  <main class="main">
    <header class="top">
      <div class="top__brand"><span class="wordmark">Citadel</span><span class="hud" id="host-label"></span></div>
      <div class="top__mid"><nav class="shortcuts" id="shortcuts" aria-label="Shortcuts" hidden></nav><section class="mu-bar" id="mu-bar" aria-label="Now playing"></section></div>
      <div class="top__right"><a class="btn btn--icon top__settings" href="/settings" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></a><button class="btn btn--icon theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to light theme" title="Toggle light/dark theme"><svg class="i"><use href="#i-sun"/></svg></button><span class="hud hud--plain badge-role"><span class="dot" id="conn-dot" title="connecting…"></span><span id="device-label">Owner device</span></span></div>
    </header>
    <section class="view is-active" id="view-home" data-view="home">
      <section class="alerts" id="alerts" aria-label="Reminders"></section>
      <div class="grid" id="grid"></div>
    </section>
    <section class="view" id="view-news" data-view="news" aria-label="News"></section>
    <section class="view" id="view-media" data-view="media" aria-label="Media">
      <div class="frame-shell"><iframe id="media-frame" title="Media" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    </section>
    <section class="view" id="view-music" data-view="music" aria-label="Companion">
      <div class="frame-shell"><iframe id="music-frame" title="Music Companion" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    </section>
    <section class="view" id="view-sql" data-view="sql" aria-label="SQL DB">
      <div class="frame-shell"><iframe id="sql-frame" title="SQL DB" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    </section>
    <section class="view" id="view-listen" data-view="listen" aria-label="Music"></section>
    <section class="view" id="view-ai" data-view="ai" aria-label="Odysseus">
      <div class="frame-shell"><iframe id="ai-frame" title="Odysseus" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    </section>
  </main>
</div>

<nav class="tabbar" aria-label="Primary (mobile)">
  <a href="#home" data-view="home" aria-current="page"><svg class="i"><use href="#i-home"/></svg>Home</a>
  <a href="#news" data-view="news"><svg class="i"><use href="#i-news"/></svg>News</a>
  <a href="#media" data-view="media"><svg class="i"><use href="#i-film"/></svg>Media</a>
  <a href="#music" data-view="music"><svg class="i"><use href="#i-disc"/></svg>Companion</a>
  <a href="#listen" data-view="listen"><svg class="i"><use href="#i-wave"/></svg>Music</a>
  <a href="#ai" data-view="ai"><svg class="i"><use href="#i-spark"/></svg>Odysseus</a>
</nav>

<dialog class="book" id="book-gig" aria-labelledby="book-gig-title">
  <form class="book__form" novalidate>
    <h2 class="book__title" id="book-gig-title">Booked a gig</h2>
    <div class="book__grid">
      <label class="book__field"><span>Artist</span><input name="artist" required maxlength="80"></label>
      <label class="book__field"><span>Date</span><input name="date" type="date" required></label>
      <label class="book__field"><span>Venue</span><input name="venue" maxlength="80"></label>
      <label class="book__field"><span>City</span><input name="city" maxlength="60"></label>
      <label class="book__field"><span>Doors (optional)</span><input name="doors" type="time"></label>
      <label class="book__field"><span>Ticket link (optional)</span><input name="ticket_url" type="url" maxlength="500" placeholder="https://…"></label>
      <label class="book__field book__field--wide"><span>Notes (optional)</span><input name="notes" maxlength="200" placeholder="e.g. block B, meeting Sam at 5"></label>
      <label class="book__check book__field--wide"><input name="diary" type="checkbox" checked> Add to Google Calendar <small>(opens a new tab: press Save there)</small></label>
    </div>
    <p class="book__error" role="alert" hidden></p>
    <div class="book__actions"><button class="btn" type="button" data-book-cancel>Cancel</button><button class="btn btn--solid" type="submit">Save gig</button></div>
  </form>
</dialog>

<script type="module" src="/static/js/icons.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
